[package]
name = "rustinator"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
arboard = "3.6.1"
crossfont = "0.9.0"
egui = "0.34.1"
egui-winit = "0.34.1"
egui_glow = "0.34.1"
env_logger = "0.11.10"
glow = "0.17"
glutin = { version = "0.32.3", default-features = false }
glutin-winit = { version = "0.5.0", default-features = false }
log = "0.4"
raw-window-handle = "0.6"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
winit = "0.30.13"

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
egui-winit = { version = "0.34.1", features = ["x11", "wayland"] }
egui_glow = { version = "0.34.1", features = ["x11", "wayland"] }
glutin = { version = "0.32.3", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
glutin-winit = { version = "0.5.0", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
winit = { version = "0.30.13", features = ["x11", "wayland"] }
