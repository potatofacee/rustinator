[package]
name = "rustinator"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
arboard = "3.6.1"
crossfont = "0.9.0"
global-hotkey = "0.7"
egui = "0.34.1"
egui-winit = "0.34.1"
egui_glow = "0.34.1"
env_logger = "0.11.10"
glow = "0.17"
glutin = { version = "0.32.3", default-features = false }
glutin-winit = { version = "0.5.0", default-features = false }
log = "0.4"
# Same major as alacritty_terminal's, so Poller/Event types unify (vendored PTY event loop).
polling = "3"
raw-window-handle = "0.6"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
winit = "0.30.13"

[target.'cfg(target_os = "linux")'.dependencies]
# EIO check in the vendored PTY event loop.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSResponder"] }
objc2-foundation = "0.3"

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
egui-winit = { version = "0.34.1", features = ["x11", "wayland"] }
egui_glow = { version = "0.34.1", features = ["x11", "wayland"] }
glutin = { version = "0.32.3", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
glutin-winit = { version = "0.5.0", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
winit = { version = "0.30.13", features = ["x11", "wayland"] }
x11rb = { version = "0.13", default-features = false }

[package.metadata.bundle]
name = "Rustinator"
identifier = "com.rustinator.app"
icon = ["assets/icon.icns"]
osx_minimum_system_version = "10.15"

[package.metadata.bundle.plist]
LSUIElement = false
